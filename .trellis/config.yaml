# mini-trellis configuration
# All values have defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "[mini-trellis] journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit journal/index after add_session.py.
# - true: auto-stage and auto-commit journal files
# - false (new-install default): write files only; you decide when to commit
#
session_auto_commit: false

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Optional. Used when SessionStart filters spec indexes by package.
#
# packages:
#   cli:
#     path: packages/cli
# default_package: cli
