[package]
name = "cli-manager-preview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wry = { version = "=0.54.3", default-features = false, features = ["os-webview", "protocol"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
wry = { version = "=0.54.3", default-features = false, features = ["os-webview", "protocol"] }
