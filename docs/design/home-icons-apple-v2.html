document.getElementById('symbols').innerHTML=data.map(([id,z,e,body])=>`<symbol id="i-${id}" viewBox="0 0 24 24" style="color:${colors[id]||'currentColor'}">${body}</symbol>`).join('')+Object.entries(extras).map(([id,body])=>`<symbol id="i-${id}" viewBox="0 0 24 24">${body}</symbol>`).join('');
const svg=(id,size)=>`<svg aria-hidden="true" ${size?`style="width:${size}px;height:${size}px"`:''}><use href="#i-${id}"/></svg>`;
let lang='zh',selected='folder';
const name=id=>{const d=data.find(d=>d[0]===id);return d[lang==='zh'?1:2]};
function inspect(id){selected=id;document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));document.getElementById('large').innerHTML=svg(id);document.getElementById('inspect-name').textContent=name(id);document.getElementById('inspect-id').textContent='symbol / '+id;document.getElementById('samples').innerHTML=[14,18,24,32].map(s=>`<div class="sample">${svg(id,s)}<small>${s} px</small></div>`).join('');document.getElementById('states').innerHTML=[0,1,2].map(()=>`<span>${svg(id)}</span>`).join('')}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en-US';document.querySelectorAll('[data-zh]').forEach(el=>el.innerHTML=el.dataset[lang]);document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=svg(el.dataset.icon));document.getElementById('nav').innerHTML=['folder','history','chart'].map((id,i)=>`<button class="navrow ${i===0?'active':''}" data-select="${id}">${svg(id)}${name(id)}${i===0?'<span class="dot"></span>':''}</button>`).join('');document.getElementById('bottom').innerHTML=['cloud','plus','settings'].map(id=>`<button class="iconbtn" title="${name(id)}" aria-label="${name(id)}" data-select="${id}">${svg(id)}</button>`).join('');document.getElementById('rail').innerHTML=['plus','command','history','branch','files','chart','cpu'].map((id,i)=>`<button class="iconbtn ${i===3?'active':''}" title="${name(id)}" aria-label="${name(id)}" data-select="${id}">${svg(id)}</button>`).join('');document.getElementById('grid').innerHTML=data.map(([id])=>`<button class="tile" data-id="${id}" data-select="${id}" aria-pressed="false">${svg(id)}<span>${name(id)}</span></button>`).join('');document.getElementById('language').textContent=lang==='zh'?'EN':'中文';document.getElementById('theme').setAttribute('aria-label',lang==='zh'?'切换明暗主题':'Toggle light and dark theme');inspect(selected)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b){inspect(b.dataset.select);if(b.classList.contains('navrow')||b.closest('.rail')){b.parentElement.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));b.classList.add('active')}}});
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').dataset.icon=document.body.classList.contains('dark')?'sun':'moon';document.getElementById('theme').innerHTML=svg(document.getElementById('theme').dataset.icon)};
document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};
document.getElementById('sizes').onclick=e=>{const b=e.target.closest('[data-size]');if(!b)return;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('grid').style.setProperty('--icon-size',b.dataset.size+'px')};
render();
</script>
