[package]
name = "cli-manager-desktop-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "cli-manager-gpui"

[[bin]]
name = "cli-manager-gpui"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
gpui-component = "=0.8.1"
cli-manager-core = { path = "../../crates/core" }
cli-manager-core-db = { path = "../../crates/core-db" }
cli-manager-core-prefs = { path = "../../crates/core-prefs" }
cli-manager-history-core = { path = "../../src-tauri/history-core" }
cli-manager-preview = { path = "../../crates/preview" }
cli-manager-pty-client = { path = "../../crates/pty-client" }
cli-manager-term-engine = { path = "../../crates/term-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
notify = "6"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

