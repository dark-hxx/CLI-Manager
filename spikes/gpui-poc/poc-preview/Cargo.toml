[package]
name = "poc-preview"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
wry = "=0.57.1"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

