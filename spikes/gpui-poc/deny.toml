[graph]
all-features = false

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense",
    "0BSD", "Apache-2.0 WITH LLVM-exception",
]
exceptions = [
    { name = "poc-compat", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-checkpoint", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-input", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-daemon", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-term", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-preview", allow = ["AGPL-3.0-or-later"] },
    { name = "poc-webview-probe", allow = ["AGPL-3.0-or-later"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [{ name = "terminal_view" }, { name = "terminal" }]
