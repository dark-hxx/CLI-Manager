[package]
name = "poc-term"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
alacritty_terminal = "=0.26.0"
poc-daemon = { path = "../poc-daemon", version = "=0.1.0" }
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "macros"] }
serde_json = "=1.0.154"

