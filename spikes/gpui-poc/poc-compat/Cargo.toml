[package]
name = "poc-compat"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
default-run = "poc-compat"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
gpui-component = "=0.8.1"
wry = "=0.57.1"
alacritty_terminal = "=0.26.0"
tokio-tungstenite = "=0.30.0"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
