[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-tauri/helpers",
  "src-tauri/hook-schema",
  "src-tauri/history-core",
  "src-tauri/agent-capabilities-core",
  "crates/web-protocol",
  "crates/core",
  "crates/core-db",
  "crates/core-prefs",
  "crates/preview",
  "crates/pty-client",
  "crates/term-engine",
  "apps/desktop-gpui",
  "apps/server",
]
exclude = ["src-tauri/ssh-agent", "spikes/*"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
